; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_l476rg]
platform = ststm32
board = nucleo_l476rg
framework = libopencm3
build_src_filter =
        +<*>
        -<hqc/main_hqc.c>
        -<hqc/main_kat.c>
        -<codes/reed_muller.c>
        -<codes/reed_solomon.c>
        -<fastmul/bc_2.c>
        -<fastmul/bmul2.c>
        -<fastmul/btfy_consts_gft.c>
        -<fastmul/btfy_ffft.c>
        -<fastmul/cvt_to_fft_asm.s>
        -<fastmul/encode_asm.s>
        -<fastmul/encode.c>
        -<fastmul/gft_mul_vi_asm.s>
        -<fastmul/gft_mul_vi.c>
        -<fastmul/irepr_s8_asm.s>
        -<fastmul/repr_s8_asm.s>
        -<fields/fft.c>
        -<fields/gf.c>

extra_scripts = 
    pre:scripts/precharger/pio_apply_precharging.py
    pre:scripts/pio.py
build_unflags = -Os 
build_flags = -O3
